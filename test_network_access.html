<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>网络访问测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .info { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>网络访问测试</h1>
    
    <div class="info">
        <h3>当前访问信息：</h3>
        <p>访问地址: <span id="currentUrl"></span></p>
        <p>主机名: <span id="hostname"></span></p>
        <p>协议: <span id="protocol"></span></p>
        <p>端口: <span id="port"></span></p>
    </div>
    
    <div class="info">
        <h3>后端API地址：</h3>
        <p id="apiUrl"></p>
    </div>
    
    <button onclick="testBackend()">测试后端连接</button>
    <button onclick="testLogin()">测试登录接口</button>
    
    <div id="result"></div>
    
    <script>
        // 显示当前访问信息
        document.getElementById('currentUrl').textContent = window.location.href;
        document.getElementById('hostname').textContent = window.location.hostname;
        document.getElementById('protocol').textContent = window.location.protocol;
        document.getElementById('port').textContent = window.location.port || '默认';
        
        // 智能计算后端地址
        function getBackendUrl() {
            const hostname = window.location.hostname;
            const protocol = window.location.protocol;
            return `${protocol}//${hostname}:5000`;
        }
        
        const backendUrl = getBackendUrl();
        document.getElementById('apiUrl').textContent = backendUrl;
        
        async function testBackend() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>正在测试后端连接...</p>';
            
            try {
                const response = await fetch(`${backendUrl}/api/places/categories`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <div class="info success">
                            <h3>✓ 后端连接成功！</h3>
                            <p>状态码: ${response.status}</p>
                            <p>返回数据: ${JSON.stringify(data)}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="info error">
                            <h3>✗ 后端返回错误</h3>
                            <p>状态码: ${response.status}</p>
                            <p>错误信息: ${response.statusText}</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="info error">
                        <h3>✗ 连接失败</h3>
                        <p>错误: ${error.message}</p>
                        <p>请确保后端服务运行在 ${backendUrl}</p>
                    </div>
                `;
            }
        }
        
        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>正在测试登录接口...</p>';
            
            try {
                const response = await fetch(`${backendUrl}/api/auth/login`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'caipj315',
                        password: 'cai123456'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="info success">
                            <h3>✓ 登录测试成功！</h3>
                            <p>状态码: ${response.status}</p>
                            <p>返回数据: ${JSON.stringify(data, null, 2)}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="info error">
                            <h3>✗ 登录失败</h3>
                            <p>状态码: ${response.status}</p>
                            <p>返回信息: ${JSON.stringify(data, null, 2)}</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="info error">
                        <h3>✗ 连接失败</h3>
                        <p>错误: ${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
