<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社区API测试</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            border-bottom: 3px solid #0ea5e9;
            padding-bottom: 10px;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: 500;
        }
        .success {
            background: #d1fae5;
            color: #065f46;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
        }
        .info {
            background: #dbeafe;
            color: #1e40af;
        }
        pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.6;
        }
        .btn {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #0284c7;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
        .loading {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 旅行社区 API 测试</h1>
        
        <div class="info">
            <strong>测试目标:</strong> 验证 <code>/api/diaries/public</code> 接口是否正常工作
        </div>

        <button class="btn" onclick="testAPI()">
            <span id="btnText">🚀 开始测试</span>
        </button>

        <div id="result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000';

        async function testAPI() {
            const resultDiv = document.getElementById('result');
            const btnText = document.getElementById('btnText');
            
            btnText.innerHTML = '<span class="loading">⏳</span> 测试中...';
            resultDiv.innerHTML = '';

            try {
                console.log('[测试] 请求 API:', `${API_BASE}/api/diaries/public`);
                
                const response = await fetch(`${API_BASE}/api/diaries/public?page=1&limit=10`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });

                console.log('[测试] 响应状态:', response.status);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('[测试] 响应数据:', data);

                let html = '<div class="status success">✅ API 测试成功!</div>';
                
                html += '<h3>📊 响应数据:</h3>';
                html += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';

                if (data.success && data.data) {
                    html += '<h3>📝 日记列表:</h3>';
                    html += `<div class="info">共 ${data.count} 篇日记，总计 ${data.total} 篇</div>`;
                    
                    if (data.data.length > 0) {
                        html += '<ul>';
                        data.data.forEach(diary => {
                            html += `<li><strong>${diary.title}</strong> by ${diary.username} (${diary.date})</li>`;
                        });
                        html += '</ul>';
                    }
                } else {
                    html += '<div class="error">⚠️ API 返回数据格式异常</div>';
                }

                resultDiv.innerHTML = html;
                btnText.innerHTML = '✅ 测试完成';

            } catch (error) {
                console.error('[测试] 错误:', error);
                
                let html = '<div class="status error">❌ API 测试失败</div>';
                html += '<h3>错误信息:</h3>';
                html += '<pre>' + error.message + '</pre>';
                
                if (error.message.includes('Failed to fetch')) {
                    html += '<div class="info">';
                    html += '<strong>可能的原因:</strong><br>';
                    html += '1. 后端服务未启动<br>';
                    html += '2. CORS 配置问题<br>';
                    html += '3. 网络连接问题<br>';
                    html += '<br><strong>解决方案:</strong><br>';
                    html += '• 确保后端运行在 http://localhost:5000<br>';
                    html += '• 运行: <code>python c:\\code\\travel\\backend\\app.py</code>';
                    html += '</div>';
                }
                
                resultDiv.innerHTML = html;
                btnText.innerHTML = '🔄 重新测试';
            }
        }

        // 页面加载时自动测试
        window.addEventListener('load', () => {
            setTimeout(testAPI, 500);
        });
    </script>
</body>
</html>
